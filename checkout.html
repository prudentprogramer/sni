<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Checkout - Quantum Tech</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
 <div class="container">
 <nav>
 <a href="index.html" class="logo">QUANTUM<span style="color: var(--text-main)">TECH</span></a>
 </nav>
 </div>
</header>

<main class="container">
 <h2 style="margin-bottom: 20px;">Secure Payment</h2>
 
 <div class="checkout-layout">
 <!-- Order Summary -->
 <div class="summary-card">
 <h3 style="margin-bottom: 20px;">Order Summary</h3>
 <div class="summary-item">
 <span>Quantum Neural Link V5</span>
 <span>$499.00</span>
 </div>
 <div class="summary-item">
 <span>Shipping</span>
 <span>Free</span>
 </div>
 <div class="summary-item">
 <span>Tax</span>
 <span>$0.00</span>
 </div>
 <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
 <div class="summary-item">
 <strong>Total</strong>
 <strong>$499.00</strong>
 </div>
 </div>

 <!-- Payment Form -->
 <div class="form-card">
 <h3 style="margin-bottom: 25px;">Payment Information</h3>
 
 <form id="paymentForm" action="process_payment.php" method="POST">
 <div class="form-group">
 <label for="name">Cardholder Name</label>
 <input type="text" id="name" name="name" placeholder="John Doe" required>
 </div>

 <div class="form-group">
 <label for="card_number">Card Number</label>
 <input type="text" id="card_number" name="card_number" placeholder="0000 0000 0000 0000" maxlength="19" required>
 </div>

 <div class="card-inputs">
 <div class="form-group">
 <label for="expiry">Expiry Date</label>
 <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
 </div>
 <div class="form-group">
 <label for="cvv">CVV</label>
 <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="3" required>
 </div>
 </div>

 <div class="form-group">
 <label for="address">Billing Address</label>
 <input type="text" id="address" name="address" placeholder="1234 Main St, Apt 4B, New York, NY 10001" required>
 </div>

 <button type="submit" class="submit-btn" id="payBtn">Pay $499.00</button>
 </form>

 <div id="successMsg" class="success-message">
 <h3>Payment Successful!</h3>
 <p>Redirecting to confirmation...</p>
 </div>
 </div>
 </div>
</main>

<script src="script.js"></script>
</body>
</html>
